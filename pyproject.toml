[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "ward"
version = "0.1.0"
description = "Autonomous multi-agent PR review system with grounded specialist reasoners"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Shwejan", email = "shwejan@ward.dev" },
]

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ── Database ──
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "pgvector>=0.3.5",

    # ── Queue ──
    "arq>=0.26.1",
    "redis>=5.2.0",

    # ── LLM & Orchestration ──
    "openai>=1.55.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",

    # ── Observability ──
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "structlog>=24.4.0",

    # ── HTTP ──
    "httpx>=0.28.0",

    # ── Utilities ──
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

# Ruff configuration lives in ruff.toml (single source of truth)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
